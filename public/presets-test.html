<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Agent Flea Market · Prompt Bazaar</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  :root { --bg:#1a1210; --panel:#241a16; --panel-raise:#2f221d; --gold:#d4a54a; --gold-dim:#b8923e;
          --text:#f3ede6; --dim:#b8a99a; --border:#3d2f28; --good:#4ade80; --bad:#f87171; }
  body { font-family:'Segoe UI',system-ui,-apple-system,sans-serif; background:var(--bg); color:var(--text); min-height:100vh; }
  header { max-width:1200px; margin:0 auto; padding:36px 24px 24px; border-bottom:1px solid var(--border); display:flex; align-items:center; gap:22px; justify-content:space-between; flex-wrap:wrap; }
  .brand { display:flex; gap:14px; align-items:center; }
  .mark { font-size:44px; filter:drop-shadow(0 0 26px rgba(212,165,74,.45)); animation:drift 3.6s ease-in-out infinite; }
  @keyframes drift { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-10px)} }
  .names h1 { font-size:clamp(24px,3.6vw,36px); font-weight:300; letter-spacing:.18em; color:var(--gold); text-transform:uppercase; }
  .names .sub { color:var(--dim); letter-spacing:.32em; font-size:12px; text-transform:uppercase; margin-top:6px; }
  .status { display:flex; gap:16px; align-items:center; }
  .dot { width:10px; height:10px; border-radius:50%; display:inline-block; }
  .dot.ok { background:var(--good); box-shadow:0 0 18px rgba(74,222,128,.45); }
  .dot.fail { background:var(--bad); box-shadow:0 0 18px rgba(248,113,113,.45); }
  .badge { padding:8px 16px; border:1px solid var(--gold); color:var(--gold); letter-spacing:.22em; text-transform:uppercase; font-size:12px; background:linear-gradient(135deg,rgba(212,165,74,.08),transparent); }

  main { max-width:1200px; margin:0 auto; padding:24px; display:grid; grid-template-columns:300px 1fr; gap:24px; }
  @media (max-width:900px){ main { grid-template-columns:1fr; } }

  section { background:var(--panel); border:1px solid var(--border); border-radius:14px; padding:16px; position:relative; overflow:hidden; }
  section::after { content:""; position:absolute; top:0; left:0; right:0; height:1px; background:linear-gradient(90deg,transparent,var(--gold),transparent); opacity:.65; }
  .shelf h2 { font-size:14px; letter-spacing:.2em; color:var(--gold); text-transform:uppercase; margin-bottom:10px; }
  .lab label, .shelf label { display:flex; flex-direction:column; gap:6px; font-size:11px; text-transform:uppercase; letter-spacing:.18em; color:var(--dim); margin-top:10px; }
  .lab input, .lab textarea, .lab select, .shelf input, .shelf textarea, .shelf select { font-family:inherit; font:inherit; background:#160f0c; color:var(--text); border:1px solid var(--border); border-radius:8px; padding:10px 12px; outline:none; transition:.15s; }
  .lab input:focus, .lab textarea:focus, .lab select:focus, .shelf input:focus { border-color:var(--gold); }
  .lab textarea, .shelf textarea { min-height:96px; resize:vertical; }

  .stall { background:var(--panel-raise); border:1px solid var(--border); border-radius:12px; padding:10px 12px; margin-top:10px; cursor:pointer; transition:.18s; }
  .stall:hover { border-color:var(--gold-dim); }
  .stall .tag { font-size:10px; letter-spacing:.22em; color:var(--gold); text-transform:uppercase; }
  .stall .name { font-size:14px; margin-top:2px; }
  .stall.active { border-color:var(--gold); box-shadow:0 0 28px rgba(212,165,74,.14); }

  .chat { display:flex; flex-direction:column; gap:12px; min-height:460px; }
  .bubble { max-width:86%; padding:12px 14px; border-radius:12px; line-height:1.55; font-size:14px; white-space:pre-wrap; word-break:break-word; }
  .bubble.user { align-self:flex-end; background:#33231d; border:1px solid #5a4235; }
  .bubble.agent { align-self:flex-start; background:#2b201c; border:1px solid var(--border); }
  .bubble.system { align-self:center; color:var(--dim); font-size:12px; letter-spacing:.1em; text-transform:uppercase; padding:8px 14px; background:transparent; border:1px dashed var(--border); }
  .composer { display:flex; gap:10px; }
  .composer input { flex:1; }
  .composer button, button { padding:10px 14px; border:1px solid var(--gold); color:var(--gold); background:transparent; border-radius:8px; font-family:inherit; font-size:12px; letter-spacing:.16em; text-transform:uppercase; cursor:pointer; transition:.15s; }
  .composer button:hover, button:hover { background:var(--gold); color:var(--bg); }
  button.ghost { color:var(--dim); border-color:var(--border); }
  button.ghost:hover { border-color:var(--dim); color:var(--text); background:transparent; }
  .events { max-height:220px; overflow:auto; font:11px/1.55 ui-monospace,Menlo,Consolas,monospace; color:var(--dim); background:#140f0d; border:1px solid var(--border); border-radius:10px; padding:10px; margin-top:12px; }
  .ev { margin-top:6px; padding:3px 6px; border-radius:6px; }
  .ev.ok { color:#86efac; }
  .ev.bad { color:#fca5a5; }
  .preview { font:12px/1.55 Consolas,Monaco,monospace; color:var(--dim); background:rgba(0,0,0,.25); border:1px solid var(--border); padding:10px; max-height:120px; overflow:auto; margin-top:8px; border-radius:8px; }
</style>
</head>
<body>
<header>
  <div class="brand">
    <div class="mark">&#127938;</div>
    <div class="names">
      <h1>Agent Flea Market</h1>
      <div class="sub">Prompt Bazaar · Live Session</div>
    </div>
  </div>
  <div class="status">
    <div><span id="statusDot" class="dot fail"></span> <span id="statusLabel">Agent offline</span></div>
    <div class="badge">Local · Bazaar</div>
  </div>
</header>

<main>
  <section class="shelf">
    <h2>Stalls</h2>
    <label>Preset <select id="preset"></select></label>
    <button id="loadPreset">Load into Chat</button>
    <div id="preview" class="preview" style="display:none"></div>
    <label>Model </label>
    <select id="model">
      <option>gemini-2.5-flash</option>
      <option>gemini-2.5-pro</option>
      <option>gemini-2.0-flash</option>
      <option>gemini-1.5-pro</option>
    </select>
    <label>API key (stored session-only)</label>
    <input id="apiKey" type="password" placeholder="AIzaSy…" autocomplete="off" />
    <button id="connectBtn">Connect</button>
    <div class="events" id="log"><div class="ev">Awaiting credentials…</div></div>
  </section>

  <section class="lab">
    <h2 style="font-size:14px;letter-spacing:.2em;color:var(--gold);text-transform:uppercase;margin-bottom:10px">Session</h2>
    <div id="chat" class="chat"></div>
    <div class="composer">
      <input id="prompt" placeholder="Your bid to the market…" />
      <button id="send">Send</button>
    </div>
  </section>
</main>

<script>
const PRESETS = [
  { name:"OpenAI", abbr:"GPT", cls:"openai", path:"/OPENAI.mkd.txt" },
  { name:"DeepSeek", abbr:"DS", cls:"deepseek", path:"/DEEPSEEK.mkd.txt" },
  { name:"Anthropic", abbr:"CL", cls:"claude", path:"/ANTHROPIC.mkd.txt" },
  { name:"Perplexity", abbr:"PX", cls:"perplexity", path:"/PERPLEXITY.mkd.txt" },
  { name:"Vercel v0", abbr:"v0", cls:"vercel", path:"/Vercel_v0.txt" }
];

const presetSel = document.getElementById("preset");
const previewEl = document.getElementById("preview");
const statusDot = document.getElementById("statusDot");
const statusLabel = document.getElementById("statusLabel");
const chatEl = document.getElementById("chat");
const logEl = document.getElementById("log");
const promptEl = document.getElementById("prompt");
const apiKeyEl = document.getElementById("apiKey");
const modelEl = document.getElementById("model");
const connectBtn = document.getElementById("connectBtn");
const sendBtn = document.getElementById("send");
const loadPresetBtn = document.getElementById("loadPreset");

let connected = false;
let presetText = "";
let presetLabel = "";
let history = [];
let verbose = false;

const WS_URL = location.origin.includes("localhost") ? "http://localhost:3000" : "";

function log(msg, ok=true) {
  const row = document.createElement("div");
  row.className = "ev " + (ok ? "ok" : "bad");
  row.textContent = `[${new Date().toLocaleTimeString()}] ${msg}`;
  logEl.prepend(row);
}

function bubble(role, text) {
  const bub = document.createElement("div");
  bub.className = "bubble " + role;
  bub.textContent = text;
  chatEl.appendChild(bub);
  chatEl.scrollTop = chatEl.scrollHeight;
}

function setStatus(up) { statusDot.className = "dot " + (up ? "ok" : "fail"); statusLabel.textContent = up ? "Agent active" : "Agent offline"; }

PRESETS.forEach((p, i) => {
  const opt = document.createElement("option");
  opt.value = i;
  opt.textContent = p.name;
  presetSel.appendChild(opt);
});

async function verifyKey() {
  const k = apiKeyEl.value.trim();
  if (!k) { log("Missing API key", false); return; }
  log("Verifying key…");
  try {
    const r = await fetch(`/api/chat`, { method:"POST", headers: {"Content-Type":"application/json; charset=utf-8","Accept":"application/json"}, body: JSON.stringify({ apiKey:k, model:"gemini-2.5-flash", messages:[{role:"user", content:"Say exactly: OK"}] }) });
    const j = await r.json();
    if (!j.ok) { connected = false; setStatus(false); log("Verify failed: " + (j.error || r.status), false); promptEl.disabled = true; sendBtn.disabled = true; return; }
    connected = true; setStatus(true); log("Connected · " + (j.reply || "ok")); promptEl.disabled = false; sendBtn.disabled = false;
  } catch(e) { connected = false; setStatus(false); log("Network error: " + e.message, false); }
}

connectBtn.onclick = verifyKey;

loadPresetBtn.onclick = async () => {
  const p = PRESETS[parseInt(presetSel.value)];
  log("Loading preset: " + p.path);
  const r = await fetch(p.path);
  const txt = await r.text();
  presetText = txt;
  presetLabel = p.name;
  previewEl.style.display = "block";
  previewEl.textContent = txt.slice(0, 1200) + (txt.length > 1200 ? "\n…" : "");
  bubble("system", `Loaded preset: ${p.name}`);
};

async function send() {
  const text = promptEl.value.trim();
  if (!text) return;
  if (!connected) { log("Connect an API key first", false); return; }
  const k = apiKeyEl.value.trim();
  promptEl.value = "";
  const userMsg = (presetText ? "PRESET: " + presetLabel + "\n\n" : "") + text;
  bubble("user", text);
  const sys = document.createElement("div");
  sys.className = "bubble system";
  sys.textContent = presetLabel ? `Agent · ${presetLabel} · ${modelEl.value}` : "Agent thinking…";
  chatEl.appendChild(sys);
  history.push({ role:"user", content: userMsg });
  const payload = { apiKey:k, model: modelEl.value, messages: history };
  const t0 = performance.now();
  try {
    const r = await fetch(`/api/chat`, { method:"POST", headers: {"Content-Type":"application/json; charset=utf-8","Accept":"application/json"}, body: JSON.stringify(payload) });
    const j = await r.json();
    if (!j.ok) { log("Chat failed: " + (j.error || r.status), false); chatEl.removeChild(sys); bubble("agent", "Error: " + (j.error || "unknown")); return; }
    const reply = j.reply || "(empty)";
    chatEl.removeChild(sys);
    bubble("agent", reply);
    history.push({ role:"model", content: reply });
    log(`Response in ${Math.round(performance.now() - t0)}ms`);
  } catch(e) { chatEl.removeChild(sys); log("Network error: " + e.message, false); bubble("agent", "Network error"); }
}

sendBtn.onclick = send;
promptEl.addEventListener("keydown", (e) => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(); } });
if (apiKeyEl.value) { log("Existing key staged — click Connect"); }
</script>
</body>
</html>
